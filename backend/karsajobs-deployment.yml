apiVersion: apps/v1
kind: Deployment
metadata:
  name: karsajobs-be
  labels:
    app: karsajobs-be
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: karsajobs-be
      tier: backend
  template:
    metadata:
      labels:
        app: karsajobs-be
        tier: backend
    spec:
      containers:
      - name: karsajobs-be
        image: ghcr.io/archieops/karsajobs:latest
        env:
        - name: APP_PORT
          value: "8080"
        - name: MONGO_HOST
          value: karsajobs-mongo
        - name: MONGO_USER
          valueFrom:
            secretKeyRef:
              name: karsajobs-mongo-secret
              key: MONGO_ROOT_USERNAME
        - name: MONGO_PASS
          valueFrom:
            secretKeyRef:
              name: karsajobs-mongo-secret
              key: MONGO_ROOT_PASSWORD
        ports:
        - containerPort: 8080